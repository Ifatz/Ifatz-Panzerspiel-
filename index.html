<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    >
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Panzer Battle 2D">

    <title>Panzer Battle 2D</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <div id="game-container">

        <canvas id="gameCanvas"></canvas>

        <div id="main-menu" class="overlay-screen">
            <div class="google-card">
                <h1>Panzer Battle 2D</h1>
                <p>Multiplayer Arena</p>

                <input
                    type="text"
                    id="player-name"
                    maxlength="12"
                    value="Kommandant"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="Spielername"
                >

                <button id="main-play-btn" type="button">SPIELEN</button>
            </div>
        </div>

        <div id="tank-select-screen" class="overlay-screen hidden">
            <div class="select-container">
                <h2>Panzer auswählen</h2>

                <div id="tank-list"></div>

                <div id="tank-details">
                    <h3 id="detail-name"></h3>
                    <p id="detail-desc"></p>

                    <div class="tank-stat">
                        <span>Lebenspunkte</span>
                        <div class="stat-bar">
                            <div id="bar-hp"></div>
                        </div>
                    </div>

                    <div class="tank-stat">
                        <span>Geschwindigkeit</span>
                        <div class="stat-bar">
                            <div id="bar-speed"></div>
                        </div>
                    </div>

                    <div class="tank-stat">
                        <span>Schaden</span>
                        <div class="stat-bar">
                            <div id="bar-damage"></div>
                        </div>
                    </div>

                    <div class="tank-stat">
                        <span>Reichweite</span>
                        <div class="stat-bar">
                            <div id="bar-range"></div>
                        </div>
                    </div>

                    <div class="tank-stat">
                        <span>Nachladezeit</span>
                        <div class="stat-bar">
                            <div id="bar-reload"></div>
                        </div>
                    </div>

                    <div id="detail-trait"></div>

                    <button id="confirm-tank-btn" type="button">
                        SPIEL BEITRETEN
                    </button>
                </div>

                <div id="secret-trigger"></div>
            </div>
        </div>

        <div id="hud-overlay" class="hidden">

            <div id="hud-player-info">
                <div id="hud-player-name">Kommandant</div>

                <div id="hud-health-container">
                    <div id="hud-health-bar"></div>
                </div>
            </div>

            <button id="leaderboard-btn" type="button">
                Rangliste
            </button>

            <div id="leaderboard-modal" class="modal-card hidden">
                <div class="modal-header">
                    <h2>Rangliste</h2>
                    <button id="close-leaderboard-btn" type="button">
                        ×
                    </button>
                </div>

                <ol id="leaderboard-list"></ol>
            </div>

            <div id="touch-controls">

                <div id="move-joystick-zone">
                    <div id="move-joystick-base">
                        <div id="move-joystick-stick"></div>
                    </div>
                </div>

                <div id="aim-joystick-zone">
                    <div id="aim-joystick-base">
                        <div id="aim-joystick-stick"></div>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <script src="config.js"></script>
    <script src="ui.js"></script>
    <script src="map.js"></script>
    <script src="weapons.js"></script>
    <script src="tank.js"></script>
    <script src="player.js"></script>
    <script src="multiplayer.js"></script>
    <script src="game.js"></script>
    <script src="main.js"></script>
</body>
</html>
